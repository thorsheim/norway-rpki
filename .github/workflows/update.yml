name: Daily data update

# Target: one update every day at 08:00 Norwegian time (Europe/Oslo).
# GitHub's own scheduler can start jobs hours late, so the most reliable trigger is an
# external call to this workflow's workflow_dispatch endpoint at 08:00 with
# inputs {"scheduled": "true"}. The two cron entries below are the fallback: 06:01 UTC is
# 08:01 in summer (CEST), 07:01 UTC is 08:01 in winter (CET). The "Decide" step makes sure
# only one update runs per day, never before 08:00 Norwegian time.
on:
  schedule:
    - cron: "1 6 * * *"
    - cron: "1 7 * * *"
  workflow_dispatch:
    inputs:
      scheduled:
        description: "Daily trigger: skip if today's 08:00 update has already run"
        required: false
        default: "false"
  push:
    branches: [main]
    paths-ignore: ["docs/data/**", "docs/*/data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      # Always work on the newest main, not the commit that triggered the run: otherwise a run
      # started by a code push can redeploy a tree without the data committed in the meantime.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0        # full history (without file contents) for the version number in the footer
          filter: blob:none
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Decide whether to build new data
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULED: ${{ inputs.scheduled }}
        run: python scripts/daily_gate.py >> "$GITHUB_OUTPUT"
      - name: Build datasets per country (one retry after 5 minutes; a failed country does not stop the others)
        if: steps.gate.outputs.build == 'true'
        id: build
        env:
          COUNTRIES: ${{ steps.gate.outputs.countries }}
        run: |
          failed=""; done=""
          for cc in $COUNTRIES; do
            case $cc in NO) out=docs/data;; *) out=docs/$(echo $cc | tr A-Z a-z)/data;; esac
            ok=""
            for attempt in 1 2; do
              echo "::group::$cc attempt $attempt"
              python scripts/build_data.py --country $cc --out $out --rpki-file "$RUNNER_TEMP/rpki.json" --asinfo-file "$RUNNER_TEMP/as.csv" && ok=1
              echo "::endgroup::"
              [ -n "$ok" ] && break
              echo "$cc attempt $attempt failed"; [ $attempt -lt 2 ] && sleep 300
            done
            if [ -n "$ok" ]; then done="$done $cc"; else failed="$failed $cc"; fi
          done
          echo "done=${done# }" >> "$GITHUB_OUTPUT"
          echo "failed=${failed# }" >> "$GITHUB_OUTPUT"
          echo "Updated: ${done:- none}  Failed: ${failed:- none}"
      - name: Commit data
        if: steps.gate.outputs.build == 'true'
        run: |
          python scripts/make_pages.py
          python scripts/run_summary.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Data update $(TZ=Europe/Oslo date +'%Y-%m-%d %H:%M %Z') (${{ steps.build.outputs.done }})"
          git pull --rebase -q && git push
      - name: Version info for the page footers
        if: steps.gate.outputs.build == 'true' || github.event_name == 'push'
        run: python scripts/version_info.py
      - uses: actions/configure-pages@v6
        if: steps.gate.outputs.build == 'true' || github.event_name == 'push'
      - uses: actions/upload-pages-artifact@v5
        if: steps.gate.outputs.build == 'true' || github.event_name == 'push'
        with:
          path: docs
      - id: deployment
        if: steps.gate.outputs.build == 'true' || github.event_name == 'push'
        uses: actions/deploy-pages@v5
      - name: Report countries that could not be updated
        if: steps.build.outputs.failed != ''
        run: |
          echo "::error::No new data for: ${{ steps.build.outputs.failed }} (the previous data stays online)"
          exit 1
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
